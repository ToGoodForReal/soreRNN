# Validação curta da config de pré-treino (configs/b0_8_pretrain.yaml) antes dos 50B: mesmo modelo e
# overrides, 50 passos em cada estágio (4096x2 e 8192x1) sobre a amostra PT. Confere o pico de VRAM
# (<= 22 GB), a ausência de OOM e de passos pulados e o tok/s real. ~1h10 na 4090.
model_preset: b0_8
model_overrides: {grad_checkpoint: true, checkpoint_policy: full, checkpoint_frac: 0.5}
data_paths: ["data/sample_pt/*.bin"]
eos_id: 0

# 524.288 tokens por passo: 50 passos = 26.214.400 tokens por estágio
grad_accum: 64
stages:
  - {until_tokens: 26214400, seq_len: 4096, micro_batch: 2}
  - {until_tokens: 52428800, seq_len: 8192, micro_batch: 1}
total_tokens: 52428800

warmup_steps: 10
# só o last.pt do fim (o disco não comporta o save atômico sobre um last.pt existente)
ckpt_every_tokens: 1e12
compile: true
seed: 0
out_dir: /mnt/windows/soreRNN/runs/b0_8_validate  # o last.pt (~7 GB) não cabe no ext4
