# Pré-treino do preset b0_8 (~0.8B) na RTX 4090: 50B tokens, contexto 4K até 35B e 8K depois.
model_preset: b0_8
# BF16 (fp8 off): no b0_8 o FP8 rowwise é mais lento que o BF16 e o tensorwise gera NaN sob compile
# (docs/relatorio_dia1_rtx4090.md). A GPU é dividida com outro treino, que precisa de 6-8 GB livres:
# checkpoint full em todos os blocos (vocab 98.304, bench 4096x2 e 8192x1): ~11.000 tok/s, 14,06 GB
# alocados / 15,63 GB reservados, ~15,9 GB no nvidia-smi (sobram ~8,7 GB). frac 0.5 dava 21,16 GB.
model_overrides: {grad_checkpoint: true, checkpoint_policy: full, checkpoint_frac: 1.0}
# Teto do alocador: passar dele dá OOM aqui (o launch_after_data.sh retoma do last.pt) em vez de
# tomar a memória do outro treino. ~0,9 GB acima do pico reservado medido.
max_vram_gb: 16.5
# Shards uint32 de scripts/make_pretrain_data.py (tokenizer podado de 98.304 ids em data/tokenizer,
# mistura da spec §5), na partição NTFS do Windows montada pelo /etc/fstab em /mnt/windows (grupo
# lab): ~200 GB não cabem no ext4 nem na "Dados".
data_paths: ["/mnt/windows/soreRNN/pretrain/*/*.bin"]
eos_id: 98278  # <|endoftext|> no tokenizer podado (data/tokenizer/meta.json)

# 4096 x 2 x 64 = 8192 x 1 x 64 = 524.288 tokens por passo -> 95.367 passos
grad_accum: 64
stages:
  - {until_tokens: 35e9, seq_len: 4096, micro_batch: 2}
  - {until_tokens: 50e9, seq_len: 8192, micro_batch: 1}
total_tokens: 50e9

warmup_steps: 1000
# Só o last.pt, sobrescrito a cada ~95 passos (sem snapshots numerados, para economizar disco).
# O save é atômico (.tmp + os.replace): durante a gravação ficam duas cópias, ~13 GB livres no b0_8.
ckpt_every_tokens: 5e7
compile: true
out_dir: /mnt/windows/soreRNN/runs/b0_8_pretrain
