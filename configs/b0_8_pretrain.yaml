# Pré-treino do preset b0_8 (~0.8B) na RTX 4090: 50B tokens, contexto 4K até 35B e 8K depois.
# Configuração validada no Protocolo de Dia 1: BF16 puro com checkpoint_policy='ffn' (~14.720 tok/s, 22.37 GB VRAM).
# Alternativa estrita <= 22 GB: checkpoint_policy='full', checkpoint_frac=0.5, fused_ce=true, fused_norm_gate=true,
# gdn_fla_conv=true, gdn_kernel_gate=true (~13.550 tok/s, 19.94 GB VRAM).
model_preset: b0_8
fp8: "off"
model_overrides:
  vocab_size: 98304
  grad_checkpoint: true
  checkpoint_policy: "ffn"
  checkpoint_frac: 1.0
data_paths: ["data/pretrain/*.bin"]
eos_id: 98303


# 4096 x 2 x 64 = 8192 x 1 x 64 = 524.288 tokens por passo -> 95.367 passos
grad_accum: 64
stages:
  - {until_tokens: 35e9, seq_len: 4096, micro_batch: 2}
  - {until_tokens: 50e9, seq_len: 8192, micro_batch: 1}
total_tokens: 50e9

warmup_steps: 1000
# last.pt a cada ~95 passos; snapshot numerado a cada ~4.768 passos, guardando os 4 mais novos
ckpt_every_tokens: 5e7
snapshot_every_tokens: 2.5e9
keep_snapshots: 4
compile: true
out_dir: runs/b0_8_pretrain
