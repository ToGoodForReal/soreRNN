# Validação curta da config de pré-treino (configs/b0_4_pretrain.yaml) antes dos 10B: mesmo modelo e
# overrides, 20 passos em cada estágio (2048x2 e 4096x1) sobre a amostra PT. Confere o pico de VRAM,
# a ausência de OOM e de passos pulados e o tok/s real. ~1,5-2 h na 3050 8GB.
# A amostra PT tem 65.536 ids (remapeamento provisório, docs/RUNBOOK.md §9): cabe no vocab de 98.304 do b0_4.
model_preset: b0_4
model_overrides: {grad_checkpoint: true, checkpoint_policy: full, checkpoint_frac: 1.0}
data_paths: ["data/sample_pt/*.bin"]
eos_id: 0

# 262.144 tokens por passo: 20 passos = 5.242.880 tokens por estágio
grad_accum: 64
stages:
  - {until_tokens: 5242880, seq_len: 2048, micro_batch: 2}
  - {until_tokens: 10485760, seq_len: 4096, micro_batch: 1}
total_tokens: 10485760

warmup_steps: 5
ckpt_every_tokens: 1e12  # só o last.pt do fim
compile: true
seed: 0
out_dir: runs/b0_4_validate
