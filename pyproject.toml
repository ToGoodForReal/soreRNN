[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sorernn"
dynamic = ["version"]
description = "soreRNN v2: LM híbrido GatedDeltaNet + atenção gated sobre PyTorch e flash-linear-attention"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14.1",
    "flash-linear-attention>=0.5.2",
    "numpy",
    "pyyaml",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = ["pytest"]

[tool.hatch.version]
path = "sore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: exige GPU CUDA (pulado automaticamente sem GPU)",
    "fla: exige GPU CUDA e flash-linear-attention (pulado automaticamente sem eles)",
]
